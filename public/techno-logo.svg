<svg id="brand-logo" class="animate" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 515 607" role="img"
         aria-label="TECHNO+ ASSOCIATES logo.">
  <style>
    .stroke{fill:none;stroke:#101010;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
    .animate .stroke{animation:draw var(--dur,.5s) cubic-bezier(.56,.05,.24,1) var(--delay,0s) forwards}
    #brand-name .stroke{stroke-width:1.65}
    #associates .stroke{stroke-width:1.45}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.stroke{stroke-dashoffset:0;animation:none}}
  </style>
      <title>TECHNO+ ASSOCIATES — logo drawing animation</title>
      <desc>A minimal black line-art network symbol, followed by TECHNO+ and the widely spaced word ASSOCIATES. The background is transparent.</desc>

      <!-- Main network axes -->
